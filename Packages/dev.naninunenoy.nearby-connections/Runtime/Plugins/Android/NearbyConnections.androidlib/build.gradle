apply plugin: 'com.android.library'

def unityLibrary = project(':unityLibrary')
evaluationDependsOn(unityLibrary.path)
def unityAndroid = unityLibrary.extensions.getByName('android')

android {
    namespace 'com.example.nearbyconnections'
    compileSdk = unityAndroid.compileSdk
    compileSdkMinor = unityAndroid.compileSdkMinor

    defaultConfig {
        minSdk = 24
        consumerProguardFiles 'consumer-rules.pro'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-nearby:19.5.1'
}
